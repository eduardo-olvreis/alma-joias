<div class="container">
  <h2>Produtos: {{ categoriaUrl }}</h2>
  @if (isLoading){
    <p>Carregando...</p>
  } @else{
    @if (joias.length > 0){
      <ul>
        @for (item of joias; track item.id) {
          <li>
            <strong>{{ item.nome }}</strong><br>
            <a [routerLink]="['/produtos/detalhe', item.id]">Exibir detalhes</a>
          </li>
        }
      </ul>
    } @else {
      <p>Nenhuma joia encontrada.</p>
    }
  }
  <a routerLink="/home">Voltar ao início</a>
</div>
