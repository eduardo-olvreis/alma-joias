<div class="relative z-50 bg-white w-full">
  
  <!-- Icone Menu -->
  <header 
    class="flex justify-between items-center p-10 max-w-7xl mx-auto"
    [style.margin-right.px]="scrollbarWidth"
  >
    <nav>
      <button (click)="toggleMenu()" class="relative z-50">
        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="currentColor">
          <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
        </svg>
      </button>
    </nav>

    <!-- Logo -->
    <h1 class="text-4xl relative z-50">
      <a routerLink="/home">ALMA</a>
    </h1>

    <!-- Ícone de Busca -->
    <nav>
      <button class="relative z-50">
        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="currentColor">
          <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
        </svg>
      </button>
    </nav>
  </header>
</div>

<!-- Blur -->
<div
  (click)="toggleMenu()"
  [class.opacity-100]="isMenuOpen"
  [class.pointer-events-auto]="isMenuOpen"
  [class.opacity-0]="!isMenuOpen"
  [class.pointer-events-none]="!isMenuOpen"
  class="fixed inset-0 w-screen h-screen z-30 bg-black/5 backdrop-blur-sm transition-opacity duration-500 ease-in-out"
></div>

<!-- Menu Aberto -->
<div class="relative z-50 bg-white w-full"></div>
<div
  [class.translate-y-0]="isMenuOpen"
  [class.-translate-y-full]="!isMenuOpen"
  class="absolute top-full left-0 w-full bg-white shadow-md z-40 transition-transform duration-700 ease-in-out pointer-events-none"
  [class.pointer-events-auto]="isMenuOpen"
>
  <ul 
    class="flex flex-col items-center py-6"
    [style.margin-right.px]="scrollbarWidth"
  >
    <li class="py-2"><a routerLink="/home" (click)="toggleMenu()">Home</a></li>
    <li class="py-2"><a routerLink="/home" fragment="categorias" (click)="toggleMenu()">Categorias</a></li>
    <li class="py-2"><a routerLink="/home" fragment="produtos" (click)="toggleMenu()">Produtos</a></li>
    <li class="py-2"><a routerLink="/sobre" (click)="toggleMenu()">Sobre</a></li>
    <li class="py-2"><a routerLink="/contato" (click)="toggleMenu()">Contato</a></li>
  </ul>
</div>
