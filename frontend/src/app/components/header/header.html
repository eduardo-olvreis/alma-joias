<div
  class="fixed top-0 left-0 z-50 w-full transition-all duration-500 ease-in-out"
  [class.text-white]="!isMenuOpen && !isScrolled"
  [class.text-black]="isMenuOpen || isScrolled"
  [class.bg-transparent]="!isScrolled && !isMenuOpen"
  [class.bg-white/90]="isScrolled && !isMenuOpen"
  [class.backdrop-blur-md]="isScrolled && !isMenuOpen"
  [class.shadow-sm]="isScrolled && !isMenuOpen"
  [class.translate-y-0]="!isHeaderHidden"
  [class.-translate-y-full]="isHeaderHidden"
>
  <header 
    class="flex justify-between items-center p-5 max-w-7xl mx-auto"
    [style.margin-right.px]="scrollbarWidth"
  >
    <nav>
      <button
        (click)="toggleMenu()"
        class="relative z-50 w-8 h-8"
        style="perspective: 1000px;"
      >
        <div
          class="relative w-full h-full transition-transform duration-700"
          style="transform-style: preserve-3d;"
          [style.transform]="isMenuOpen ? 'rotateY(180deg)' : 'rotateY(0deg)'"
        >
          <div 
            class="absolute inset-0 flex items-center justify-center"
            style="backface-visibility: hidden; -webkit-backface-visibility: hidden;"
          >
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              fill="currentColor"
              class="w-8 h-8"
            >
              <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
            </svg>
          </div>

          <div 
            class="absolute inset-0 flex items-center justify-center"
            style="transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden;"
          >
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              fill="currentColor"
              class="w-8 h-8"
            >
              <path d="M256-200 200-256l224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
            </svg>
          </div>
        </div>
      </button>
    </nav>

    <h1 class="text-4xl relative z-50">
      <a routerLink="/home" class="flex flex-col items-center justify-center text-center">
        <span>ALMA</span>
        <span class="text-xs tracking-widest mt-1">JOIAS</span>
      </a>
    </h1>

    <nav>
      <button class="relative z-50">
        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="currentColor">
          <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
        </svg>
      </button>
    </nav>
  </header>
</div>

<div
  (click)="toggleMenu()"
  [class.opacity-100]="isMenuOpen"
  [class.pointer-events-auto]="isMenuOpen"
  [class.opacity-0]="!isMenuOpen"
  [class.pointer-events-none]="!isMenuOpen"
  class="fixed inset-0 w-screen h-screen z-30 bg-black/5 backdrop-blur-sm transition-opacity duration-500 ease-in-out"
></div>

<div
  [class.translate-y-0]="isMenuOpen"
  [class.-translate-y-full]="!isMenuOpen"
  class="fixed top-0 left-0 w-full pt-24 bg-white/80 backdrop-blur-md z-40 transition-transform duration-700 ease-in-out pointer-events-none"
  [class.pointer-events-auto]="isMenuOpen"
>
  <ul 
    class="flex flex-col items-center pb-6 transition-all duration-300"
    [class.opacity-100]="isMenuOpen"
    [class.opacity-0]="!isMenuOpen"
    [class.translate-y-0]="isMenuOpen"
    [class.-translate-y-2]="!isMenuOpen"
    [class.delay-300]="isMenuOpen"
    [style.margin-right.px]="scrollbarWidth"
  >
    <li class="py-2"><a routerLink="/home" (click)="toggleMenu()">Home</a></li>
    <li class="py-2"><a routerLink="/home" fragment="categorias" (click)="toggleMenu()">Categorias</a></li>
    <li class="py-2"><a routerLink="/home" fragment="produtos" (click)="toggleMenu()">Produtos</a></li>
    <li class="py-2"><a routerLink="/sobre" (click)="toggleMenu()">Sobre</a></li>
    <li class="py-2"><a routerLink="/contato" (click)="toggleMenu()">Contato</a></li>
  </ul>
</div>
